services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinema
      POSTGRES_PASSWORD: sinema
      POSTGRES_DB: sinema
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinema"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
